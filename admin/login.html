<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | CONNECTA Admin</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        :root {
            --bg-dark: #3A2116;
            --bg-medium: #5A3522;
            --bg-light: #8A5A35;
            --gold: #D9B16E;
            --gold-light: #E5C27A;
            --gold-bright: #F5DE9A;
            --white: #FFF8ED;
            --text-dark: #2C1A0E;
            --text-medium: #6B4A30;
            --text-light: #9A7A5A;
            --shadow: 0 8px 32px rgba(58, 33, 22, 0.15);
            --shadow-lg: 0 20px 60px rgba(58, 33, 22, 0.25);
            --radius: 16px;
            --radius-sm: 10px;
            --radius-full: 50px;
            --transition: all 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            --font-main: 'Montserrat', sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(145deg, var(--bg-dark), var(--bg-medium));
            padding: 20px;
        }

        .login-container {
            width: 100%;
            max-width: 420px;
        }

        .login-card {
            background: rgba(255, 248, 237, 0.05);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(217, 177, 110, 0.2);
            border-radius: var(--radius);
            padding: 48px 40px;
            box-shadow: var(--shadow-lg);
        }

        .login-logo {
            text-align: center;
            margin-bottom: 40px;
        }

        .login-logo .logo-icon {
            width: auto;
            height: 2cm;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 16px;
            overflow: hidden;
        }

        .login-logo .logo-icon img {
            height: 100%;
            width: auto;
            object-fit: contain;
        }

        .login-logo h1 {
            color: var(--white);
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: 2px;
        }

        .login-logo p {
            color: rgba(255, 255, 255, 0.5);
            font-size: 0.85rem;
            margin-top: 4px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            color: rgba(255, 255, 255, 0.7);
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .form-group input {
            width: 100%;
            padding: 14px 18px;
            background: rgba(255, 255, 255, 0.06);
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: var(--radius-sm);
            color: var(--white);
            font-family: var(--font-main);
            font-size: 1rem;
            transition: var(--transition);
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--gold);
            box-shadow: 0 0 0 4px rgba(217, 177, 110, 0.15);
            background: rgba(255, 255, 255, 0.08);
        }

        .form-group input::placeholder {
            color: rgba(255, 255, 255, 0.3);
        }

        .form-group .input-icon {
            position: relative;
        }

        .form-group .input-icon i {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: rgba(255, 255, 255, 0.3);
        }

        .form-group .input-icon input {
            padding-left: 44px;
        }

        .btn-login {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, var(--gold), var(--gold-light));
            color: var(--bg-dark);
            border: none;
            border-radius: var(--radius-full);
            font-family: var(--font-main);
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(217, 177, 110, 0.4);
        }

        .btn-login:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .login-error {
            background: rgba(255, 0, 0, 0.1);
            border: 1px solid rgba(255, 0, 0, 0.2);
            border-radius: var(--radius-sm);
            padding: 12px 16px;
            color: #ff6b6b;
            font-size: 0.85rem;
            display: none;
            margin-bottom: 20px;
        }

        .login-error.show {
            display: block;
        }

        .login-footer {
            text-align: center;
            margin-top: 24px;
            color: rgba(255, 255, 255, 0.3);
            font-size: 0.8rem;
        }

        .login-footer a {
            color: var(--gold);
            text-decoration: none;
            transition: var(--transition);
        }

        .login-footer a:hover {
            color: var(--gold-light);
        }

        .security-badge {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-top: 16px;
            color: rgba(255, 255, 255, 0.2);
            font-size: 0.7rem;
            flex-wrap: wrap;
        }

        .security-badge i {
            font-size: 0.6rem;
        }

        .security-badge .sep {
            color: rgba(255, 255, 255, 0.1);
        }

        /* Responsivo */
        @media (max-width: 480px) {
            .login-card {
                padding: 32px 24px;
            }
            .login-logo .logo-icon {
                height: 1.6cm;
            }
        }
    </style>
</head>
<body>

    <div class="login-container">
        <div class="login-card">
            <div class="login-logo">
                <div class="logo-icon">
                    <img src="/logo.png" alt="CONNECTA">
                </div>
                <h1>CONNECTA</h1>
                <p>Painel Administrativo</p>
            </div>

            <div class="login-error" id="loginError">
                <i class="fas fa-exclamation-circle"></i>
                <span id="errorMessage">Credenciais inválidas. Tente novamente.</span>
            </div>

            <form id="loginForm" autocomplete="off" novalidate>
                <div class="form-group">
                    <label for="username">Usuário</label>
                    <div class="input-icon">
                        <i class="fas fa-user"></i>
                        <input type="text" id="username" placeholder="Digite seu usuário" required
                               autocomplete="username" aria-label="Usuário">
                    </div>
                </div>

                <div class="form-group">
                    <label for="password">Senha</label>
                    <div class="input-icon">
                        <i class="fas fa-lock"></i>
                        <input type="password" id="password" placeholder="Digite sua senha" required
                               autocomplete="current-password" aria-label="Senha">
                    </div>
                </div>

                <button type="submit" class="btn-login" id="loginBtn">
                    <i class="fas fa-arrow-right"></i>
                    Entrar
                </button>
            </form>

            <div class="security-badge">
                <i class="fas fa-shield-alt"></i>
                <span>Ambiente seguro</span>
                <span class="sep">•</span>
                <i class="fas fa-lock"></i>
                <span>Conexão criptografada</span>
                <span class="sep">•</span>
                <i class="fas fa-user-shield"></i>
                <span>Acesso restrito</span>
            </div>

            <div class="login-footer">
                <a href="/">← Voltar para o site</a>
            </div>
        </div>
    </div>

    <script>
        // ============================================
        // CONFIGURAÇÃO DO ADMIN MASTER
        // ============================================
        const ADMIN_CREDENTIALS = {
            username: 'connecta',
            password: 'Admin@2025!'
        };

        // ============================================
        // ELEMENTOS
        // ============================================
        const form = document.getElementById('loginForm');
        const usernameInput = document.getElementById('username');
        const passwordInput = document.getElementById('password');
        const loginBtn = document.getElementById('loginBtn');
        const loginError = document.getElementById('loginError');
        const errorMessage = document.getElementById('errorMessage');

        // ============================================
        // FUNÇÕES
        // ============================================
        function showError(message) {
            errorMessage.textContent = message;
            loginError.classList.add('show');
            setTimeout(() => {
                loginError.classList.remove('show');
            }, 5000);
        }

        function hideError() {
            loginError.classList.remove('show');
        }

        function setLoading(isLoading) {
            if (isLoading) {
                loginBtn.disabled = true;
                loginBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Autenticando...';
            } else {
                loginBtn.disabled = false;
                loginBtn.innerHTML = '<i class="fas fa-arrow-right"></i> Entrar';
            }
        }

        // ============================================
        // SANITIZAÇÃO
        // ============================================
        function sanitizeInput(value) {
            return value.replace(/[<>]/g, '').trim();
        }

        // ============================================
        // VERIFICAR SE JÁ ESTÁ LOGADO
        // ============================================
        (function checkSession() {
            const session = localStorage.getItem('connecta_admin');
            if (session) {
                try {
                    const data = JSON.parse(session);
                    if (data.loggedIn && data.timestamp) {
                        const elapsed = Date.now() - data.timestamp;
                        if (elapsed < 24 * 60 * 60 * 1000) {
                            // Já está logado - redirecionar para dashboard
                            window.location.href = '/admin/dashboard.html';
                            return;
                        } else {
                            localStorage.removeItem('connecta_admin');
                        }
                    }
                } catch (e) {
                    localStorage.removeItem('connecta_admin');
                }
            }
        })();

        // ============================================
        // SUBMIT DO FORMULÁRIO
        // ============================================
        form.addEventListener('submit', function(e) {
            e.preventDefault();
            hideError();

            const username = sanitizeInput(usernameInput.value);
            const password = sanitizeInput(passwordInput.value);

            if (!username || !password) {
                showError('Preencha todos os campos.');
                return;
            }

            // Prevenir brute force
            const attempts = parseInt(localStorage.getItem('login_attempts') || '0');
            if (attempts >= 5) {
                const lastAttempt = parseInt(localStorage.getItem('login_last_attempt') || '0');
                const cooldown = 5 * 60 * 1000;
                if (Date.now() - lastAttempt < cooldown) {
                    const remaining = Math.ceil((cooldown - (Date.now() - lastAttempt)) / 60000);
                    showError(`Muitas tentativas. Aguarde ${remaining} minutos.`);
                    return;
                } else {
                    localStorage.setItem('login_attempts', '0');
                }
            }

            setLoading(true);

            setTimeout(() => {
                if (username === ADMIN_CREDENTIALS.username && password === ADMIN_CREDENTIALS.password) {
                    // Resetar tentativas
                    localStorage.setItem('login_attempts', '0');

                    // Login bem-sucedido
                    localStorage.setItem('connecta_admin', JSON.stringify({
                        loggedIn: true,
                        username: username,
                        timestamp: Date.now(),
                        sessionId: Math.random().toString(36).substring(2, 15)
                    }));

                    // REDIRECIONAR PARA DASHBOARD
                    window.location.href = '/admin/dashboard.html';
                } else {
                    // Incrementar tentativas
                    const attempts = parseInt(localStorage.getItem('login_attempts') || '0');
                    localStorage.setItem('login_attempts', (attempts + 1).toString());
                    localStorage.setItem('login_last_attempt', Date.now().toString());

                    showError('Usuário ou senha incorretos. Tente novamente.');
                    setLoading(false);
                    passwordInput.value = '';
                    passwordInput.focus();

                    // Feedback visual de erro
                    passwordInput.style.borderColor = '#ff6b6b';
                    setTimeout(() => {
                        passwordInput.style.borderColor = '';
                    }, 3000);
                }
            }, 800);
        });

        // ============================================
        // ENTER PARA SUBMIT
        // ============================================
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                const active = document.activeElement;
                if (active === usernameInput || active === passwordInput) {
                    form.dispatchEvent(new Event('submit'));
                }
            }
        });

        // ============================================
        // LOGOUT AUTOMÁTICO POR INATIVIDADE (15min)
        // ============================================
        let inactivityTimer;

        function resetInactivityTimer() {
            clearTimeout(inactivityTimer);
            inactivityTimer = setTimeout(() => {
                if (localStorage.getItem('connecta_admin')) {
                    localStorage.removeItem('connecta_admin');
                }
            }, 15 * 60 * 1000);
        }

        // ============================================
        // PREVENIR CLIQUE DIREITO
        // ============================================
        document.addEventListener('contextmenu', function(e) {
            e.preventDefault();
            return false;
        });

        // ============================================
        // PREVENIR DEV TOOLS
        // ============================================
        document.addEventListener('keydown', function(e) {
            if (e.key === 'F12' ||
                (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'J')) ||
                (e.ctrlKey && e.key === 'u')) {
                e.preventDefault();
                return false;
            }
        });

        // ============================================
        // REGISTRO DE ATIVIDADE
        // ============================================
        function logSecurityEvent(event) {
            const logs = JSON.parse(localStorage.getItem('security_logs') || '[]');
            logs.push({
                event: event,
                timestamp: new Date().toISOString(),
                userAgent: navigator.userAgent,
                url: window.location.href
            });
            if (logs.length > 100) {
                logs.shift();
            }
            localStorage.setItem('security_logs', JSON.stringify(logs));
        }

        logSecurityEvent('login_page_loaded');
    </script>
</body>
</html>
