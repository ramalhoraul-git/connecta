<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | CONNECTA Admin</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        :root {
            --bg-dark: #3A2116;
            --bg-medium: #5A3522;
            --bg-light: #8A5A35;
            --gold: #D9B16E;
            --gold-light: #E5C27A;
            --gold-bright: #F5DE9A;
            --white: #FFF8ED;
            --text-dark: #2C1A0E;
            --text-medium: #6B4A30;
            --text-light: #9A7A5A;
            --shadow: 0 8px 32px rgba(58,33,22,0.15);
            --shadow-lg: 0 20px 60px rgba(58,33,22,0.25);
            --radius: 16px;
            --radius-sm: 10px;
            --radius-full: 50px;
            --transition: all 0.4s cubic-bezier(0.25,0.46,0.45,0.94);
            --font-main: 'Montserrat', sans-serif;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: var(--font-main);
            background: var(--white);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(165deg, var(--white) 0%, #F5EDE0 100%);
        }

        .login-container {
            background: var(--white);
            border-radius: var(--radius);
            padding: 48px 40px;
            max-width: 420px;
            width: 100%;
            box-shadow: var(--shadow-lg);
            border: 1px solid rgba(217,177,110,0.1);
        }

        .login-header {
            text-align: center;
            margin-bottom: 32px;
        }

        .login-header .logo {
            width: auto;
            height: 2cm;
            margin: 0 auto 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .login-header .logo img {
            height: 100%;
            width: auto;
            object-fit: contain;
        }

        .login-header h1 {
            font-size: 1.3rem;
            font-weight: 700;
            color: var(--text-dark);
        }

        .login-header p {
            font-size: 0.85rem;
            color: var(--text-light);
            margin-top: 4px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-weight: 600;
            font-size: 0.85rem;
            color: var(--text-dark);
            margin-bottom: 6px;
        }

        .form-group input {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid rgba(58,33,22,0.08);
            border-radius: var(--radius-sm);
            font-family: var(--font-main);
            font-size: 0.95rem;
            color: var(--text-dark);
            transition: var(--transition);
            background: #FDF8F0;
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--gold);
            box-shadow: 0 0 0 4px rgba(217,177,110,0.12);
            background: var(--white);
        }

        .form-group .input-icon {
            position: relative;
        }

        .form-group .input-icon i {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-light);
        }

        .form-group .input-icon input {
            padding-left: 44px;
        }

        .btn-login {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, var(--gold), var(--gold-light));
            color: var(--bg-dark);
            border: none;
            border-radius: var(--radius-full);
            font-family: var(--font-main);
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(217,177,110,0.3);
        }

        .btn-login:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .btn-login i.fa-spinner {
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .error-message {
            background: rgba(239,68,68,0.08);
            border: 1px solid rgba(239,68,68,0.15);
            color: #dc2626;
            padding: 10px 14px;
            border-radius: var(--radius-sm);
            font-size: 0.85rem;
            margin-bottom: 16px;
            display: none;
        }

        .error-message.show {
            display: block;
        }

        .login-footer {
            text-align: center;
            margin-top: 24px;
            font-size: 0.75rem;
            color: var(--text-light);
        }

        .login-footer a {
            color: var(--gold);
            font-weight: 600;
        }

        .login-footer a:hover {
            color: var(--gold-light);
        }

        .status-badge {
            text-align: center;
            font-size: 0.7rem;
            color: var(--text-light);
            margin-bottom: 16px;
            padding: 6px 12px;
            border-radius: var(--radius-full);
            background: rgba(16,185,129,0.06);
            border: 1px solid rgba(16,185,129,0.1);
        }

        .status-badge .dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            margin-right: 6px;
        }

        .status-badge .dot.online {
            background: #10b981;
            animation: pulse-dot 2s ease-in-out infinite;
        }

        .status-badge .dot.offline {
            background: #ef4444;
        }

        @keyframes pulse-dot {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(0.8); }
        }

        @media (max-width: 480px) {
            .login-container {
                padding: 32px 24px;
                margin: 16px;
            }
            .login-header .logo {
                height: 1.6cm;
            }
        }
    </style>
</head>
<body>

    <div class="login-container">
        <!-- Header -->
        <div class="login-header">
            <div class="logo">
                <img src="/logo.png" alt="CONNECTA">
            </div>
            <h1>Área Administrativa</h1>
            <p>Faça login para gerenciar o site</p>
        </div>

        <!-- Status do Banco -->
        <div class="status-badge" id="statusBanco">
            <span class="dot online" id="statusDot"></span>
            <span id="statusTexto">Verificando conexão...</span>
        </div>

        <!-- Mensagem de erro -->
        <div class="error-message" id="errorMessage">
            <i class="fas fa-exclamation-circle"></i>
            <span id="errorText">Credenciais inválidas</span>
        </div>

        <!-- Formulário -->
        <form id="loginForm" autocomplete="off">
            <div class="form-group">
                <label for="email">E-mail</label>
                <div class="input-icon">
                    <i class="fas fa-envelope"></i>
                    <input type="email" id="email" placeholder="admin@connecta.com.br" value="admin@connecta.com.br" required>
                </div>
            </div>

            <div class="form-group">
                <label for="senha">Senha</label>
                <div class="input-icon">
                    <i class="fas fa-lock"></i>
                    <input type="password" id="senha" placeholder="••••••••" value="admin123" required>
                </div>
            </div>

            <button type="submit" class="btn-login" id="btnLogin">
                <i class="fas fa-sign-in-alt"></i>
                <span>Entrar</span>
            </button>
        </form>

        <div class="login-footer">
            <p>CONNECTA Contabilidade &copy; 2025</p>
        </div>
    </div>

    <script>
        // ============================================
        // SUPABASE CONFIG
        // ============================================
        const SUPABASE_URL = 'https://spztajsribpyaittolnr.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNwenRhanNyaWJweWFpdHRvbG5yIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU3NDI1MDgsImV4cCI6MjEwMTMxODUwOH0.a82tfOuttNg-LXJnPGfbmovqUGMUUfL8yDeMcr1EY8U';

        // ============================================
        // ELEMENTOS
        // ============================================
        const form = document.getElementById('loginForm');
        const emailInput = document.getElementById('email');
        const senhaInput = document.getElementById('senha');
        const btnLogin = document.getElementById('btnLogin');
        const errorMessage = document.getElementById('errorMessage');
        const errorText = document.getElementById('errorText');
        const statusTexto = document.getElementById('statusTexto');
        const statusDot = document.getElementById('statusDot');

        // ============================================
        // VERIFICAR STATUS DO SUPABASE
        // ============================================
        async function verificarStatus() {
            try {
                const response = await fetch(`${SUPABASE_URL}/rest/v1/usuarios?limit=1`, {
                    headers: {
                        'apikey': SUPABASE_ANON_KEY,
                        'Authorization': `Bearer ${SUPABASE_ANON_KEY}`
                    }
                });

                if (response.ok) {
                    statusDot.className = 'dot online';
                    statusTexto.textContent = '✅ Banco conectado';
                } else {
                    statusDot.className = 'dot offline';
                    statusTexto.textContent = '⚠️ Banco indisponível';
                }
            } catch (error) {
                statusDot.className = 'dot offline';
                statusTexto.textContent = '❌ Erro de conexão';
            }
        }

        // ============================================
        // FAZER LOGIN
        // ============================================
        async function fazerLogin(email, senha) {
            try {
                // Buscar usuário no Supabase
                const url = `${SUPABASE_URL}/rest/v1/usuarios?email=eq.${encodeURIComponent(email)}`;
                const response = await fetch(url, {
                    headers: {
                        'apikey': SUPABASE_ANON_KEY,
                        'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
                        'Content-Type': 'application/json'
                    }
                });

                if (!response.ok) {
                    throw new Error('Erro ao buscar usuário');
                }

                const usuarios = await response.json();

                if (usuarios.length === 0) {
                    throw new Error('Usuário não encontrado');
                }

                const usuario = usuarios[0];

                // Verificar senha (em produção, use hash)
                if (usuario.senha !== senha) {
                    throw new Error('Senha incorreta');
                }

                // Login bem-sucedido
                const sessionData = {
                    loggedIn: true,
                    user: {
                        id: usuario.id,
                        email: usuario.email,
                        nome: usuario.nome || 'Administrador',
                        role: usuario.role || 'admin'
                    },
                    timestamp: Date.now()
                };

                localStorage.setItem('connecta_admin', JSON.stringify(sessionData));

                // Redirecionar
                window.location.href = '/admin/dashboard.html';

            } catch (error) {
                throw new Error(error.message);
            }
        }

        // ============================================
        // SUBMIT DO FORMULÁRIO
        // ============================================
        form.addEventListener('submit', async function(e) {
            e.preventDefault();

            const email = emailInput.value.trim();
            const senha = senhaInput.value.trim();

            if (!email || !senha) {
                mostrarErro('Preencha todos os campos');
                return;
            }

            // Desabilitar botão
            btnLogin.disabled = true;
            btnLogin.innerHTML = '<i class="fas fa-spinner"></i><span>Entrando...</span>';
            errorMessage.classList.remove('show');

            try {
                await fazerLogin(email, senha);
            } catch (error) {
                mostrarErro(error.message);
                btnLogin.disabled = false;
                btnLogin.innerHTML = '<i class="fas fa-sign-in-alt"></i><span>Entrar</span>';
            }
        });

        // ============================================
        // MOSTRAR ERRO
        // ============================================
        function mostrarErro(mensagem) {
            errorText.textContent = mensagem;
            errorMessage.classList.add('show');
        }

        // ============================================
        // PREVENIR ENTER DUPLO
        // ============================================
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && !btnLogin.disabled) {
                form.dispatchEvent(new Event('submit'));
            }
        });

        // ============================================
        // INICIALIZAR
        // ============================================
        document.addEventListener('DOMContentLoaded', function() {
            // Verificar se já está logado
            const session = localStorage.getItem('connecta_admin');
            if (session) {
                try {
                    const data = JSON.parse(session);
                    if (data.loggedIn && Date.now() - data.timestamp < 24 * 60 * 60 * 1000) {
                        window.location.href = '/admin/dashboard.html';
                        return;
                    }
                } catch (e) {}
            }

            verificarStatus();

            // Verificar status a cada 30 segundos
            setInterval(verificarStatus, 30000);

            console.log('🔐 Login com Supabase carregado!');
        });
    </script>

</body>
</html>
