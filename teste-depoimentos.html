<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teste - Carrossel Depoimentos 2 em 2</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial, sans-serif; background: #1a0f0a; padding: 40px 20px; color: #fff; }
        .container { max-width: 1200px; margin: 0 auto; }
        .section-header { text-align: center; margin-bottom: 40px; }
        .section-header h2 { font-size: 2.5rem; color: #D9B16E; }
        .section-header p { color: rgba(255,255,255,0.5); }

        .carousel-wrapper { position: relative; overflow: hidden; }
        .carousel-track { display: flex; gap: 28px; transition: transform 0.6s ease; }
        .testimonial-card {
            min-width: calc(50% - 14px);
            background: rgba(255,248,237,0.05);
            border: 1px solid rgba(217,177,110,0.1);
            border-radius: 16px;
            padding: 30px;
            flex-shrink: 0;
        }
        .testimonial-card .stars { color: #D9B16E; font-size: 0.9rem; margin-bottom: 12px; }
        .testimonial-card .texto {
            color: rgba(255,255,255,0.85);
            font-size: 1rem;
            line-height: 1.8;
            word-wrap: break-word;
            overflow-wrap: break-word;
            margin-bottom: 16px;
        }
        .testimonial-card .autor { display: flex; align-items: center; gap: 12px; }
        .testimonial-card .autor .avatar {
            width: 44px; height: 44px; border-radius: 50%;
            background: #D9B16E; display: flex; align-items: center;
            justify-content: center; font-weight: 700; color: #1a0f0a;
        }
        .testimonial-card .autor .nome { font-weight: 600; }
        .testimonial-card .autor .empresa { font-size: 0.8rem; color: rgba(255,255,255,0.4); }

        .controls { display: flex; justify-content: center; gap: 20px; margin-top: 30px; }
        .controls button {
            width: 48px; height: 48px; border-radius: 50%;
            border: 1px solid rgba(255,255,255,0.1);
            background: transparent; color: #fff;
            cursor: pointer; font-size: 1.2rem;
            transition: 0.3s;
        }
        .controls button:hover { background: rgba(217,177,110,0.2); border-color: #D9B16E; }
        .controls .dots { display: flex; gap: 10px; align-items: center; }
        .controls .dots .dot {
            width: 10px; height: 10px; border-radius: 50%;
            background: rgba(255,255,255,0.2); cursor: pointer;
            transition: 0.3s;
        }
        .controls .dots .dot.active { background: #D9B16E; width: 28px; border-radius: 4px; }

        @media (max-width: 768px) {
            .testimonial-card { min-width: 100%; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="section-header">
            <h2>Depoimentos</h2>
            <p>2 depoimentos por vez - teste</p>
        </div>

        <div class="carousel-wrapper">
            <div class="carousel-track" id="track">
                <!-- Depoimentos inseridos pelo JS -->
            </div>
        </div>

        <div class="controls">
            <button id="prevBtn"><i class="fas fa-chevron-left"></i></button>
            <div class="dots" id="dots"></div>
            <button id="nextBtn"><i class="fas fa-chevron-right"></i></button>
        </div>
    </div>

    <script>
        const depoimentos = [
            { nome: "Raul Ramalho", empresa: "Vigorre", iniciais: "R", texto: "A Connecta entregam exatamente o que todo empreendedor precisa: transparência e segurança. A contabilidade deixou de ser uma dor de cabeça para virar um pilar de tranquilidade. A gente sabe onde está pisando e confia de olhos fechados." },
            { nome: "Daniele Aparecida", empresa: "Amovin", iniciais: "D", texto: "O trabalho da Erilma vai muito além de cumprir obrigações. Ela nos dá consciência real sobre os números e a situação da empresa, sempre com uma comunicação direta e sem enrolação." },
            { nome: "Gabriela Melo", empresa: "Terapia Ocupacional", iniciais: "G", texto: "Eu não entendia nada de contabilidade, e ela tem sido essencial para me ajudar a compreender todos os processos. Sempre tira minhas dúvidas com muita clareza." },
            { nome: "Daniela Boaventura", empresa: "Fonoaudiologia", iniciais: "D", texto: "Há 1 ano tenho a satisfação de contar com a parceria da Erilma. Desde o início, ela me orientou com muita competência para regularizar meu Imposto de Renda, tornando todo o processo muito mais tranquilo." }
        ];

        let currentIndex = 0;
        let perView = 2;
        const total = depoimentos.length;

        function getPerView() {
            return window.innerWidth <= 768 ? 1 : 2;
        }

        function renderizar() {
            const track = document.getElementById('track');
            track.innerHTML = depoimentos.map(d => `
                <div class="testimonial-card">
                    <div class="stars">★★★★★</div>
                    <div class="texto">"${d.texto}"</div>
                    <div class="autor">
                        <div class="avatar">${d.iniciais}</div>
                        <div>
                            <div class="nome">${d.nome}</div>
                            <div class="empresa">${d.empresa}</div>
                        </div>
                    </div>
                </div>
            `).join('');

            atualizarDots();
            atualizarCarrossel();
        }

        function atualizarDots() {
            const dotsContainer = document.getElementById('dots');
            perView = getPerView();
            const totalDots = Math.ceil(total / perView);
            dotsContainer.innerHTML = '';
            for (let i = 0; i < totalDots; i++) {
                const dot = document.createElement('span');
                dot.className = 'dot' + (i === Math.floor(currentIndex / perView) ? ' active' : '');
                dot.addEventListener('click', () => { currentIndex = i * perView;
                    atualizarCarrossel(); });
                dotsContainer.appendChild(dot);
            }
        }

        function atualizarCarrossel() {
            const track = document.getElementById('track');
            perView = getPerView();
            const maxIndex = Math.max(0, total - perView);
            if (currentIndex > maxIndex) currentIndex = maxIndex;
            if (currentIndex < 0) currentIndex = 0;

            const card = track.querySelector('.testimonial-card');
            if (!card) return;

            const cardWidth = card.offsetWidth || 350;
            const gap = 28;
            const offset = currentIndex * (cardWidth + gap);
            track.style.transform = `translateX(-${offset}px)`;

            const dots = document.querySelectorAll('.dot');
            const activeDot = Math.floor(currentIndex / perView);
            dots.forEach((dot, i) => dot.classList.toggle('active', i === activeDot));
        }

        // Controles
        document.getElementById('prevBtn').addEventListener('click', function() {
            perView = getPerView();
            currentIndex = Math.max(0, currentIndex - perView);
            atualizarCarrossel();
        });

        document.getElementById('nextBtn').addEventListener('click', function() {
            perView = getPerView();
            const maxIndex = Math.max(0, total - perView);
            if (currentIndex + perView < total) {
                currentIndex += perView;
                if (currentIndex > maxIndex) currentIndex = maxIndex;
            } else {
                currentIndex = 0;
            }
            atualizarCarrossel();
        });

        // Autoplay
        let autoplay = setInterval(() => {
            perView = getPerView();
            const maxIndex = Math.max(0, total - perView);
            if (currentIndex + perView < total) {
                currentIndex += perView;
                if (currentIndex > maxIndex) currentIndex = maxIndex;
            } else {
                currentIndex = 0;
            }
            atualizarCarrossel();
        }, 5000);

        // Pausa no hover
        const wrapper = document.querySelector('.carousel-wrapper');
        wrapper.addEventListener('mouseenter', () => clearInterval(autoplay));
        wrapper.addEventListener('mouseleave', () => {
            autoplay = setInterval(() => {
                perView = getPerView();
                const maxIndex = Math.max(0, total - perView);
                if (currentIndex + perView < total) {
                    currentIndex += perView;
                    if (currentIndex > maxIndex) currentIndex = maxIndex;
                } else {
                    currentIndex = 0;
                }
                atualizarCarrossel();
            }, 5000);
        });

        window.addEventListener('resize', () => {
            atualizarDots();
            atualizarCarrossel();
        });

        // Inicializar
        renderizar();
        console.log('✅ Carrossel de teste rodando!');
    </script>
</body>
</html>
